name: Build and release q2-utilities-app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc python3 python3-venv zip unzip file squashfs-tools curl binutils
      - uses: actions/cache@v5
        id: sysroot
        with:
          path: ~/.cache/q2/sysroot
          key: q2-sysroot-v136-${{ runner.os }}-${{ hashFiles('tools/mksysroot.sh') }}
      - name: Prepare Q2 sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/downloader"
          "$RUNNER_TEMP/downloader/bin/pip" install gdown==5.2.0
          "$RUNNER_TEMP/downloader/bin/gdown" 1HyST2-QkhUa6BdJP_ljBjkICxd-u8act -O "$RUNNER_TEMP/stock.zip"
          bash tools/mksysroot.sh "$RUNNER_TEMP/stock.zip" "$HOME/.cache/q2/sysroot"
      - name: Test and build
        run: |
          make check
          make
      - name: Verify install package
        run: |
          unzip -t dist/.utilities-app.zip
          unzip -p dist/.utilities-app.zip .utilities-app/q2app | grep -Fx 'name=Utilities'
          unzip -p dist/.utilities-app.zip .utilities-app/q2app | grep -Fx 'row=library'
          test "$(unzip -Z1 dist/.utilities-app.zip | sort)" = "$(printf '%s\n' .utilities-app/q2-utilities-app .utilities-app/q2app .utilities-app/run .utilities-app/icon.png .utilities-app/icon-40.png .utilities-app/pane.png | sort)"
          python3 - <<'PY'
          import struct, zipfile
          with zipfile.ZipFile("dist/.utilities-app.zip") as z:
              for name, size in (("icon.png", 52), ("icon-40.png", 40), ("pane.png", 96)):
                  data = z.read(".utilities-app/" + name)
                  assert data[:8] == b"\x89PNG\r\n\x1a\n"
                  assert struct.unpack(">IIBB", data[16:26]) == (size, size, 8, 6)
          PY
          file dist/.utilities-app/q2-utilities-app | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-utilities-app-card-app
          path: dist/.utilities-app.zip
          include-hidden-files: true
          if-no-files-found: error

  # A main-branch VERSION bump produces a release only after the complete
  # Q2 MIPS/host-test artifact job succeeds. Existing v* tag releases continue
  # to work. Publishing on main requires a *new* VERSION, so normal edits do
  # not silently emit new versions.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: q2-utilities-app-card-app
          path: dist
      - name: Identify version and create missing release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a semantic version (e.g. 1.3.1)"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no new release needed."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              --field "ref=refs/tags/$tag" --field "sha=$GITHUB_SHA"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publish validated install ZIP
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          install -m 0644 dist/.utilities-app.zip "dist/q2-utilities-app-$RELEASE_TAG.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/q2-utilities-app-$RELEASE_TAG.zip" --clobber
          elif [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            gh release create "$RELEASE_TAG" "dist/q2-utilities-app-$RELEASE_TAG.zip" \
              --verify-tag --title "Utilities $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" "dist/q2-utilities-app-$RELEASE_TAG.zip" \
              --verify-tag --generate-notes --title "Utilities $RELEASE_TAG"
          fi
